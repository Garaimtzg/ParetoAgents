[project]
name = "pareto-agents"
version = "0.0.1"
description = "Coste/resultado de repartir tareas de código entre Opus, Sonnet y Haiku (SWE-bench Verified)."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Fases posteriores: anthropic (Track SDK), pandas/matplotlib/scipy (Fase 6).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
